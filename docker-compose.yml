services:
  ytdl:
    build: .
    container_name: youtube-mp3-downloader
    ports:
      - "8800:8000"
    restart: unless-stopped
    environment:
      - WORK_DIR=/app/work
    # Uncomment to keep large playlist downloads on host disk instead of the
    # container's writable layer:
    # volumes:
    #   - ./work:/app/work
